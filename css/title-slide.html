<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
<div style="background: rgba(250, 247, 240, 0.88); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 18px; padding: 26px 42px 26px; margin: 0 auto; width: 980px; box-sizing: border-box; box-shadow: 0 10px 36px rgba(0, 0, 0, 0.3); text-align: left;">
$if(kicker)$
  <p style="margin: 0; font-size: 0.72em; font-weight: 600; color: #521463;">$kicker$$if(date)$, $date$$endif$</p>
  <div style="width: 56px; height: 3px; border-radius: 2px; background: #C2560A; margin: 8px 0 14px;"></div>
$endif$
  <h1 class="title" style="margin: 0; text-align: left;">$title$</h1>
$if(subtitle)$
  <p class="subtitle" style="margin: 0.4em 0 0; font-style: italic; font-size: 0.8em; color: #6E6E6E;">$subtitle$</p>
$endif$
</div>
<div style="display: flex; justify-content: center; align-items: center; gap: 56px; margin: 40px auto; width: fit-content; padding: 14px 40px; border-radius: 18px; background: rgba(250, 247, 240, 0.88); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 10px 36px rgba(0, 0, 0, 0.3);">
  <img src="assets/Logos/APC.png" style="height: 80px; margin: 0; border-radius: 6px;"/>
  <img src="assets/Logos/scipol.png" style="height: 84px; margin: 0;"/>
  <img src="assets/Logos/AstroDeep-2.png" style="height: 88px; margin: 0;"/>
  <img src="assets/Logos/cosmostat.png" style="height: 54px; margin: 0;"/>
</div>
<div style="background: rgba(250, 247, 240, 0.88); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 18px; padding: 18px 36px 16px; margin: 0 auto; width: fit-content; max-width: 960px; box-shadow: 0 10px 36px rgba(0, 0, 0, 0.3); text-align: center;">
  <p style="margin: 0; font-size: 0.85em;">$for(by-author)$<span style="color: #C2560A; font-weight: 700;">$it.name.literal$</span>$endfor$$if(affiliation)$<span style="color: #2E2E2E; margin-left: 0.7em;">$affiliation$</span>$endif$</p>
$if(supervisors)$
  <p style="margin: 0.4em 0 0; font-size: 0.62em; color: #6E6E6E;">$supervisors$</p>
$endif$
</div>
$if(slides-url)$
<p style="margin: 36px 0 0; text-align: center; font-size: 0.65em;"><span style="display: inline-block; padding: 6px 18px; border-radius: 10px; background: rgba(250, 247, 240, 0.9); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); color: #6E6E6E;">slides at <a href="$slides-url$" style="margin-left: 0.4em; color: #C2560A; text-decoration: underline;">$slides-url-text$</a></span></p>
$endif$
</section>
